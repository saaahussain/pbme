[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pbme"
version = "0.1.0"
description = "Purpose-bound minimum-data enforcement for tool-using AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8"]
all = ["mcp>=2,<3", "pytest>=8"]

[project.scripts]
pbme-demo = "pbme.demo:main"
pbme-eval = "pbme.evaluation:main"
pbme-mcp = "pbme.mcp_server:main"
pbme-token = "pbme.token_cli:main"
pbme-benchmark = "pbme.benchmark.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
